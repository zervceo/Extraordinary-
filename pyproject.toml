[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mbtok"
version = "1.0.0"
description = "Aesthetic mood board video generator for TikTok, built only from footage you already own"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["tiktok", "video", "moodboard", "ffmpeg", "aesthetic", "social"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]

# No runtime dependencies by design. Everything mbtok needs from a media file
# it gets from ffmpeg, which keeps setup on a Mac to a single brew install.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
mbtok = "mbtok.cli:main"

[tool.setuptools]
packages = ["mbtok"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
